services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: kiwi
      MARIADB_USER: kiwi
      MARIADB_PASSWORD: kiwi_local
      MARIADB_ROOT_PASSWORD: root_local
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: kiwi
      WORDPRESS_DB_USER: kiwi
      WORDPRESS_DB_PASSWORD: kiwi_local
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wp_data:/var/www/html
      - ./themes/kiwi:/var/www/html/wp-content/themes/kiwi

  cli:
    image: wordpress:cli-php8.3
    depends_on:
      - db
      - wordpress
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: kiwi
      WORDPRESS_DB_USER: kiwi
      WORDPRESS_DB_PASSWORD: kiwi_local
    volumes:
      - wp_data:/var/www/html
      - ./themes/kiwi:/var/www/html/wp-content/themes/kiwi
    entrypoint: ["sh", "-c", "sleep infinity"]

volumes:
  db_data:
  wp_data:
